<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-label="Example terminal output of open-source-finder ranking a repo's issues">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #c9d1d9; }
    .dim { fill: #8b949e; }
    .prompt { fill: #3fb950; }
    .head { fill: #e6edf3; font-weight: bold; }
    .num { fill: #79c0ff; }
    .good { fill: #3fb950; font-weight: bold; }
    .flag { fill: #d29922; }
    .link { fill: #58a6ff; }
  </style>
  <rect width="860" height="350" rx="10" fill="#0d1117"/>
  <rect width="860" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="860" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="430" y="22" text-anchor="middle" class="dim">open-source-finder</text>

  <text x="20" y="62" xml:space="preserve"><tspan class="prompt">$</tspan> open-source-finder scan owner/repo --top 3</text>
  <text x="20" y="96" xml:space="preserve" class="head">owner/repo - best issues for a first contribution - judged by Jev (jev-latest)</text>
  <text x="20" y="130" xml:space="preserve" class="dim"> #  Issue                                                 Beginner  Clear  Size    Flags</text>

  <text x="20" y="156" xml:space="preserve"> <tspan class="num">1</tspan>  #812   Typo in "Configuration" section of README        <tspan class="good">0.93</tspan>   0.91  tiny    <tspan class="flag">gfi-label</tspan></text>
  <text x="20" y="174" xml:space="preserve" class="link">    https://github.com/owner/repo/issues/812</text>
  <text x="20" y="200" xml:space="preserve"> <tspan class="num">2</tspan>  #790   Error message for missing config is unclear      <tspan class="good">0.81</tspan>   0.86  small</text>
  <text x="20" y="218" xml:space="preserve" class="link">    https://github.com/owner/repo/issues/790</text>
  <text x="20" y="244" xml:space="preserve"> <tspan class="num">3</tspan>  #774   Add test for empty input to parse_args()         <tspan class="good">0.78</tspan>   0.80  small   <tspan class="flag">unsure</tspan></text>
  <text x="20" y="262" xml:space="preserve" class="link">    https://github.com/owner/repo/issues/774</text>

  <text x="20" y="296" xml:space="preserve" class="dim">Skipped 6 issue(s) that look like questions or discussions.</text>
  <text x="20" y="318" xml:space="preserve" class="dim">Total Jev spend so far: $0.000912 of $5.00 (30 requests, 21,714 input tokens)</text>
</svg>
