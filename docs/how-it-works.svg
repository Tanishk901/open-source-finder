<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-label="How it works: fetch issues from GitHub, ask Jev five questions per issue, rank in code, show the best first issues">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .step { font-size: 12px; font-weight: 600; fill: #57606a; letter-spacing: 0.5px; }
    .title { font-size: 17px; font-weight: 700; }
    .body { font-size: 13px; fill: #424a53; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #0550ae; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .jev { fill: #f3f0ff; stroke: #8250df; stroke-width: 2; }
    .arrow { stroke: #8c959f; stroke-width: 2; fill: none; }
  </style>
  <rect width="920" height="300" rx="12" fill="#f6f8fa"/>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <!-- 1 Fetch -->
  <rect x="20" y="24" width="190" height="252" rx="10" class="box"/>
  <text x="38" y="52" class="step">STEP 1</text>
  <text x="38" y="76" class="title">Fetch</text>
  <text x="38" y="104" class="body">Open issues from the</text>
  <text x="38" y="122" class="body">GitHub API</text>
  <text x="38" y="152" class="body">Drops pull requests</text>
  <text x="38" y="170" class="body">and assigned issues</text>
  <text x="38" y="200" class="body">Reads the latest</text>
  <text x="38" y="218" class="body">5 comments of each</text>

  <path d="M212 150 H 248" class="arrow" marker-end="url(#head)"/>

  <!-- 2 Jev -->
  <rect x="252" y="24" width="220" height="252" rx="10" class="jev"/>
  <text x="270" y="52" class="step" fill="#8250df">STEP 2</text>
  <text x="270" y="76" class="title">Ask Jev</text>
  <text x="270" y="100" class="body">5 questions, 1 request per issue</text>
  <text x="270" y="130" class="mono">scope</text><text x="400" y="130" class="body">Score</text>
  <text x="270" y="152" class="mono">clarity</text><text x="400" y="152" class="body">Score</text>
  <text x="270" y="174" class="mono">context_needed</text><text x="400" y="174" class="body">Score</text>
  <text x="270" y="196" class="mono">actionable</text><text x="400" y="196" class="body">yes/no</text>
  <text x="270" y="218" class="mono">claimed</text><text x="400" y="218" class="body">yes/no</text>
  <text x="270" y="250" class="body">Typed answers + confidence,</text>
  <text x="270" y="266" class="body">not generated text</text>

  <path d="M474 150 H 510" class="arrow" marker-end="url(#head)"/>

  <!-- 3 Rank -->
  <rect x="514" y="24" width="190" height="252" rx="10" class="box"/>
  <text x="532" y="52" class="step">STEP 3</text>
  <text x="532" y="76" class="title">Rank in code</text>
  <text x="532" y="104" class="body">Skip questions and</text>
  <text x="532" y="122" class="body">discussions</text>
  <text x="532" y="152" class="body">Beginner score =</text>
  <text x="532" y="170" class="body">small + clear + easy</text>
  <text x="532" y="200" class="body">Flag claimed and</text>
  <text x="532" y="218" class="body">unsure issues</text>
  <text x="532" y="248" class="mono">rank.py</text>

  <path d="M706 150 H 742" class="arrow" marker-end="url(#head)"/>

  <!-- 4 Result -->
  <rect x="746" y="24" width="154" height="252" rx="10" class="box"/>
  <text x="764" y="52" class="step">STEP 4</text>
  <text x="764" y="76" class="title">Your list</text>
  <text x="764" y="104" class="body">Best first issues,</text>
  <text x="764" y="122" class="body">with links</text>
  <text x="764" y="152" class="body">Table or JSON</text>
  <rect x="764" y="176" width="118" height="10" rx="3" fill="#2da44e"/>
  <rect x="764" y="194" width="96" height="10" rx="3" fill="#2da44e" opacity="0.75"/>
  <rect x="764" y="212" width="74" height="10" rx="3" fill="#2da44e" opacity="0.5"/>
  <rect x="764" y="230" width="52" height="10" rx="3" fill="#2da44e" opacity="0.3"/>
</svg>
